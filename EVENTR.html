<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Events | Viansh Art Workshop</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- html2canvas for Image Saving -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- QRCode.js for generating QR codes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0;500;0;600;0;700;1;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Cormorant Garamond"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
    @media print {
        body * { visibility: hidden; }
        .print-only-ticket, .print-only-ticket * { visibility: visible; }
        .print-only-ticket {
            position: absolute; 
            left: 0; 
            top: 0; 
            width: 100%;
            border: none; 
            box-shadow: none;
        }
        .no-print { display: none !important; }
    }
</style>
</head>
<body class="font-sans text-[#2d2d2d] bg-[#F8F9FA] min-h-screen">

    <!-- Header -->
    <header class="w-full bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-gray-100/50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="flex flex-col">
                <span class="text-2xl font-bold tracking-wide text-purple-700 font-serif flex items-center gap-1">
                    Viansh <span class="text-xs text-pink-500 font-sans">🎨</span>
                </span>
                <span class="text-[9px] uppercase tracking-[0.25em] text-gray-400 font-bold mt-0.5">Back to Home</span>
            </a>
        </div>
    </header>

    <!-- Dynamic Events Section -->
    <section class="max-w-7xl mx-auto px-6 py-16">
        <h1 class="text-4xl md:text-5xl font-black font-serif text-slate-900 mb-2">Upcoming Workshops</h1>
        <p class="text-gray-500 mb-10 font-medium">Select a workshop to reserve your seat instantly.</p>

        <!-- Container where Supabase will inject the cards -->
        <div id="events-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <p id="loading-text" class="text-gray-400 font-semibold animate-pulse">Loading live events...</p>
        </div>
    </section>

    <!-- Glassmorphism Booking Modal -->
    <div id="booking-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 transition-opacity">
        <div class="bg-white/10 border border-white/20 backdrop-blur-xl p-8 rounded-3xl max-w-md w-full shadow-2xl relative">
            
            <!-- Close Button -->
            <button onclick="closeModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white text-2xl transition">&times;</button>
            
            <h3 id="modal-workshop-title" class="text-2xl font-bold font-serif text-white mb-1">Book Workshop</h3>
            <p class="text-pink-400 text-xs tracking-widest uppercase font-bold mb-6">Secure via Razorpay</p>

            <form id="registration-form" onsubmit="initiatePayment(event)" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-extrabold text-gray-300 uppercase tracking-widest mb-1.5">Full Name</label>
                    <input type="text" id="cust-name" required class="w-full bg-white/5 border border-white/10 rounded-xl p-3.5 text-white placeholder-gray-500 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 transition">
                </div>

                <div>
                    <label class="block text-[10px] font-extrabold text-gray-300 uppercase tracking-widest mb-1.5">Email Address</label>
                    <input type="email" id="cust-email" required class="w-full bg-white/5 border border-white/10 rounded-xl p-3.5 text-white placeholder-gray-500 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 transition">
                </div>

                <div>
                    <label class="block text-[10px] font-extrabold text-gray-300 uppercase tracking-widest mb-1.5">Mobile Number (UPI)</label>
                    <input type="tel" id="cust-phone" required class="w-full bg-white/5 border border-white/10 rounded-xl p-3.5 text-white placeholder-gray-500 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 transition">
                </div>

                <!-- Dynamic Time Slot Selection -->
                <div>
                    <label class="block text-[10px] font-extrabold text-gray-300 uppercase tracking-widest mb-1.5">Preferred Time Slot</label>
                    <select id="cust-time" required class="w-full bg-white/5 border border-white/10 rounded-xl p-3.5 text-white focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 transition">
                        <!-- Options injected dynamically by EVENTRJS.JS -->
                    </select>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-extrabold tracking-widest uppercase text-xs py-4 rounded-xl shadow-lg transition transform hover:-translate-y-0.5 mt-6">
                    Pay ₹1 & Book Seat
                </button>
            </form>
        </div>
    </div>

    <!-- Ticket Modal -->
    <div id="ticket-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        
        <!-- Main Ticket Container with Background Image -->
        <div id="ticket-content" class="bg-white bg-[url('images/ticketbg.png')] bg-cover bg-center p-8 rounded-2xl w-full max-w-sm shadow-2xl relative border-t-8 border-yellow-500 print-only-ticket overflow-hidden">
            
            <!-- Light overlay to ensure text remains readable over the background image -->
        
    
            <div class="relative z-10">
                <!-- Close Button -->
                <button id="close-ticket-btn" onclick="closeTicket()" class="absolute -top-3 -right-3 text-gray-400 hover:text-red-500 text-2xl font-bold no-print bg-white rounded-full w-8 h-8 flex items-center justify-center shadow">&times;</button>
                
                <!-- Ticket Header -->
                <div class="text-center mb-6 border-b border-gray-300 pb-4"> 
                    <h2 class="text-2xl font-serif font-black text-gray-900 tracking-widest uppercase">Viansh Events</h2>
                </div>
                 

                <!-- Ticket Details -->
                <div class="space-y-4 mb-4">
                    <div>
                        <p class="text-[10px] text-gray-500 uppercase font-bold tracking-wider">Attendee Name</p>
                        <p id="ticket-name" class="font-bold text-gray-900 text-lg">---</p>
                    </div>
                    
                    <div>
                        <p class="text-[10px] text-gray-500 uppercase font-bold tracking-wider">Workshop</p>
                        <p id="ticket-event" class="font-bold text-gray-900 text-lg">---</p>
                    </div>
                    
                    <!-- Date & Time Row -->
                    <div class="flex justify-between items-center py-2">
                        <div class="w-1/2">
                            <p class="text-[10px] text-gray-500 uppercase font-bold tracking-wider">Date:</p>
                            <p id="ticket-date" class="font-bold text-gray-800 text-sm">---</p>
                        </div>
                        <div class="w-1/2 text-right">
                            <p class="text-[10px] text-gray-500 uppercase font-bold tracking-wider">Time:</p>
                            <p id="ticket-time" class="font-bold text-gray-800 text-sm">---</p>
                        </div>
                    </div>

                    <div>
                        <p class="text-[10px] text-gray-500 uppercase font-bold tracking-wider">Payment ID</p>
                        <p id="ticket-id" class="font-mono text-sm text-gray-800 font-semibold">---</p>
                    </div>
                    
                    <div class="pt-2">
                        <p class="text-sm font-bold text-green-600 flex items-center gap-1 bg-white/50 inline-block px-2 py-1 rounded">
                            <span>✅</span> Paid & Confirmed
                        </p>
                    </div>
                </div>

                <!-- QR Code & Footer -->
                <div class="flex flex-col items-center justify-center mt-6 border-t border-gray-300 pt-6">
                    <div id="ticket-qrcode" class="mb-3 p-2 bg-white border border-gray-200 rounded-lg shadow-sm"></div>
                    <p class="text-xs font-bold text-gray-700 uppercase tracking-widest">Thank You</p>
                </div>
                
                <!-- Action Buttons -->
                <div class="flex gap-3 no-print mt-6">
                    <button onclick="downloadTicketImage()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-yellow-200 uppercase text-[10px] tracking-widest">
                        Save Image
                    </button>
                    <button onclick="window.print()" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-3 rounded-xl transition shadow-lg shadow-gray-300 uppercase text-[10px] tracking-widest">
                        Print PDF
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script engine -->
    <script src="EVENTRJS.JS"></script>  
</body>
</html>
