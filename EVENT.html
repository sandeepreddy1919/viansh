<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details | Viansh Art Workshop</title>
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Satisfy&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Cormorant Garamond"', 'serif'],
                        script: ['Satisfy', 'cursive'],
                    },
                    // Continuous smooth VERTICAL image scrolling animation
                    keyframes: {
                        scrollVertical: {
                            '0%': { transform: 'translateY(0%)' },
                            '100%': { transform: 'translateY(-50%)' }
                        }
                    },
                    animation: {
                        'scroll-img-v': 'scrollVertical 22s linear infinite',
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans text-[#2d2d2d] antialiased relative overflow-x-hidden">

    <!-- Decorative Background -->
    <div class="fixed inset-0 z-[-1] h-full w-full bg-slate-50 bg-[radial-gradient(#d1d5db_1px,transparent_1px)] [background-size:20px_20px]">
        <div class="absolute top-0 right-0 -z-10 w-[600px] h-[600px] bg-purple-200/50 rounded-full blur-[120px] opacity-60 mix-blend-multiply"></div>
        <div class="absolute bottom-[-10%] left-[-10%] -z-10 w-[600px] h-[600px] bg-pink-200/50 rounded-full blur-[120px] opacity-60 mix-blend-multiply"></div>
    </div>

    <!-- Header Navigation -->
    <nav class="w-full bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-200/50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xs font-bold uppercase tracking-wider text-purple-600 hover:text-black transition">
                ← Back to Home
            </a>
            <span class="text-xl font-bold font-serif text-purple-700">Viansh <span class="text-xs text-pink-500 font-sans">🎨</span></span>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="py-16 text-center px-4 relative z-10">
        <span class="font-script text-3xl text-purple-900 block capitalize mb-2">Discover Our</span>
        <h1 class="text-4xl md:text-5xl font-black font-serif text-slate-900 tracking-tight">Event Experiences</h1>
        <p class="text-sm text-gray-600 mt-4 max-w-xl mx-auto">Explore our range of creative workshops, customized DIY stalls, and private events.</p>
    </header>

    <!-- DYNAMIC EVENT DETAILS CONTAINER -->
    <main id="dynamic-events-container" class="max-w-6xl mx-auto px-6 py-8 space-y-16">
        <div class="text-center text-gray-500 py-12" id="loading-spinner">
            <p class="animate-pulse font-bold tracking-widest uppercase text-sm">Loading Events...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-[#0f1319] text-gray-400 py-8 text-center text-xs mt-12">
        <p>© 2026 VIANSH Art Workshop. All Rights Reserved.</p>
    </footer>

    <!-- JAVASCRIPT: SUPABASE & DYNAMIC LOGIC -->
    <script>
        // 1. Supabase Initialization (Using supabaseClient to prevent variable conflicts)
        const SUPABASE_URL = 'https://nzlnilejmrsmvaambkip.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_sDau1lh7K-BZmQKs8OEA2A_xmmtg6pO';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. Toggle Read More / Read Less Function
        window.toggleReadMore = function(textId, button) {
            const moreText = document.getElementById(textId);
            if (!moreText) return;

            if (moreText.classList.contains("hidden")) {
                moreText.classList.remove("hidden");
                moreText.classList.add("inline");
                button.innerText = "- Read Less";
            } else {
                moreText.classList.remove("inline");
                moreText.classList.add("hidden");
                button.innerText = "+ Read More";
            }
        };

        // 3. Load Event Details from "eventdesz" Table
        async function loadEventDetails() {
            const container = document.getElementById('dynamic-events-container');
            const loading = document.getElementById('loading-spinner');

            try {
                const { data: events, error } = await supabaseClient
                    .from('eventdesz') 
                    .select('*')
                    .order('display_order', { ascending: true });

                if (error) throw error;

                if (!events || events.length === 0) {
                    loading.innerHTML = "<p class='text-gray-500'>No events found at the moment.</p>";
                    return;
                }

                loading.remove();

                // Theme color border mapper
                const colorMap = {
                    purple: 'border-l-purple-500',
                    pink: 'border-l-pink-500',
                    cyan: 'border-l-cyan-500',
                    emerald: 'border-l-emerald-500',
                    amber: 'border-l-amber-500',
                    rose: 'border-l-rose-500',
                    indigo: 'border-l-indigo-500'
                };

                events.forEach((event, index) => {
                    // --- Text Truncation Logic ---
                    const description = event.description || "Join us for an interactive creative experience!";
                    const charLimit = 160;
                    const isLongText = description.length > charLimit;

                    const visibleText = isLongText ? description.substring(0, charLimit) : description;
                    const hiddenText = isLongText ? description.substring(charLimit) : "";

                    const themeBorderClass = colorMap[event.color_theme] || 'border-l-purple-500'; 
                    const uniqueTextId = `read-more-${event.id || index}`;

                    // --- Image Parsing & Duplication Logic ---
                    let rawImages = event.image_url || 'https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=800&q=80';
                    let imageList = [];

                    if (Array.isArray(rawImages)) {
                        imageList = rawImages;
                    } else if (typeof rawImages === 'string') {
                        imageList = rawImages.split(',').map(url => url.trim()).filter(Boolean);
                    }

                    if (imageList.length === 0) {
                        imageList = ['https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=800&q=80'];
                    }

                    // Duplicate images if there are fewer than 3 to keep vertical scrolling seamless
                    while (imageList.length < 3) {
                        imageList = imageList.concat(imageList);
                    }

                    // Render vertical image cards
                    const renderImageItems = (urls) => urls.map(url => `
                        <img src="${url}" alt="${event.title}" class="w-full h-48 sm:h-52 object-cover rounded-xl shadow-xs flex-shrink-0">
                    `).join('');

                    const imageGroupHTML = renderImageItems(imageList);

                    // --- Event Card Layout ---
                    const eventSection = `
                        <section id="event-${event.id || index}" class="scroll-mt-24">
                            <div class="bg-white/70 backdrop-blur-md rounded-2xl shadow-sm border border-gray-100 border-l-4 ${themeBorderClass} hover:shadow-md transition-shadow overflow-hidden">
                                
                                <div class="grid grid-cols-1 lg:grid-cols-2 gap-0">
                                    
                                    <!-- LEFT COLUMN: Complete Text & Read More -->
                                    <div class="p-6 sm:p-8 flex flex-col justify-between">
                                        <div>
                                            <h2 class="text-2xl sm:text-3xl font-extrabold font-serif text-slate-900 mb-4">${event.title}</h2>
                                            
                                            <div class="text-sm text-gray-700 leading-relaxed font-normal">
                                                <span>${visibleText}</span><span id="${uniqueTextId}" class="hidden">${hiddenText}</span>
                                                
                                                ${isLongText ? `
                                                    <button type="button" onclick="toggleReadMore('${uniqueTextId}', this)" 
                                                            class="text-[11px] font-bold text-purple-600 hover:text-purple-800 block mt-3 uppercase tracking-widest transition-colors focus:outline-none">
                                                        + Read More
                                                    </button>
                                                ` : ''}
                                            </div>
                                        </div>

                                        <div class="mt-6 pt-4 border-t border-gray-100">
                                            <a href="${event.registration_url || 'https://wa.me/918186854511'}" target="_blank" 
                                               class="inline-block bg-slate-900 hover:bg-purple-700 text-white text-[11px] font-bold uppercase tracking-widest px-6 py-3 rounded-full transition-colors shadow-xs">
                                                Register Now
                                            </a>
                                        </div>
                                    </div>

                                    <!-- RIGHT COLUMN: VERTICAL Image Scrolling Animation -->
                                    <div class="relative h-[320px] sm:h-[380px] lg:h-auto w-full overflow-hidden bg-slate-100">
                                        <div class="absolute inset-0 flex flex-col h-max animate-scroll-img-v hover:[animation-play-state:paused]">
                                            <!-- First Set -->
                                            <div class="flex flex-col space-y-3 p-4">
                                                ${imageGroupHTML}
                                            </div>
                                            <!-- Duplicate Set (For Seamless Infinite Loop) -->
                                            <div class="flex flex-col space-y-3 p-4 pt-0">
                                                ${imageGroupHTML}
                                            </div>
                                        </div>

                                        <!-- Top & Bottom Vignette Overlay Gradients -->
                                        <div class="absolute inset-x-0 top-0 h-10 bg-gradient-to-b from-white/70 to-transparent pointer-events-none z-10"></div>
                                        <div class="absolute inset-x-0 bottom-0 h-10 bg-gradient-to-t from-white/70 to-transparent pointer-events-none z-10"></div>
                                    </div>

                                </div>

                            </div>
                        </section>
                    `;

                    container.insertAdjacentHTML('beforeend', eventSection);
                });

            } catch (err) {
                console.error("Error loading events from eventdesz:", err);
                loading.innerHTML = `<p class='text-red-500 text-sm font-semibold'>Failed to load event details: ${err.message || 'Check database settings'}</p>`;
            }
        }

        document.addEventListener("DOMContentLoaded", loadEventDetails);
    </script>
</body>
</html>
