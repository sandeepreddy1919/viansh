<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Scanner | Viansh Admin</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- HTML5 QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        /* 1. Fix the White-on-White Text Issue */
        #reader, #reader * {
            color: #0f172a !important; /* Forces all text inside the box to be dark slate */
        }
        
        /* 2. Style the "Request Camera" button so it's a visible yellow pill */
        #reader button {
            background-color: #eab308 !important; 
            color: #000 !important; 
            font-weight: 900 !important;
            padding: 12px 24px !important;
            border-radius: 0.5rem !important;
            text-transform: uppercase !important;
            margin: 15px auto !important;
            display: inline-block !important;
            cursor: pointer;
            border: none !important;
        }

        /* 3. Hide the annoying "Powered by" link */
        #reader a {
            display: none !important; 
        }
        
        /* 4. Keep the camera feed looking clean */
        #reader video {
            border-radius: 0.5rem !important;
            margin-top: 10px !important;
            width: 100% !important;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-6">

    <div class="text-center mb-8">
        <h1 class="text-3xl font-black tracking-widest text-yellow-500 uppercase mb-2">Door Scanner</h1>
        <p class="text-gray-400 text-sm">Tap the yellow button below to start</p>
    </div>

    <!-- Camera Window: Added text-slate-900 and min-height so it doesn't collapse -->
    <div id="reader" class="w-full max-w-md bg-white text-slate-900 rounded-2xl overflow-hidden mb-6 shadow-2xl border-4 border-slate-700 p-6 min-h-[250px]"></div>

    <!-- Results Display Box (Hidden by default) -->
    <div id="result-box" class="w-full max-w-md p-8 rounded-2xl text-center hidden shadow-2xl transition-all duration-300 border-2 border-white/20">
        <p id="result-icon" class="text-6xl mb-4 drop-shadow-md"></p>
        <p id="result-message" class="font-black text-2xl uppercase tracking-wider mb-2 drop-shadow-md"></p>
        <p id="attendee-name" class="text-xl font-bold mb-1 drop-shadow-md"></p>
        <p id="ticket-slot" class="text-sm font-medium opacity-90 mb-6 drop-shadow-md"></p>
        
        <button onclick="resetScanner()" class="bg-black/40 hover:bg-black/60 text-white font-bold py-3 px-8 rounded-xl transition w-full uppercase tracking-widest text-sm border border-white/20">
            Scan Next Ticket
        </button>
    </div>

    <script>
        // Wrap everything in window.onload to ensure the library is fully loaded before it tries to render the camera
        window.onload = function() {
            // 1. Initialize Supabase
            const supabaseUrl = 'https://pduejtjmpvlhsqblviff.supabase.co';
            const supabaseKey = 'sb_publishable_XEqvPJ-kQujXK0ONksCexA_r4NaUW99'; 
            const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

            const resultBox = document.getElementById('result-box');
            const resultIcon = document.getElementById('result-icon');
            const resultMessage = document.getElementById('result-message');
            const attendeeName = document.getElementById('attendee-name');
            const ticketSlot = document.getElementById('ticket-slot');
            
            let isScanning = true;

            // 2. Initialize the Scanner
            const html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", 
                { fps: 10, qrbox: { width: 250, height: 250 } }, 
                false
            );

            // 3. The Verification Logic
            async function onScanSuccess(decodedText, decodedResult) {
                if (!isScanning) return; 
                isScanning = false;
                
                html5QrcodeScanner.pause();
                showResult("bg-blue-600", "⏳", "CHECKING DATABASE...", "Please wait", "");

                try {
                    const { data: ticket, error } = await supabase
                        .from('registrations')
                        .select('*')
                        .eq('payment_id', decodedText)
                        .single();

                    if (error || !ticket) {
                        showResult("bg-red-600", "❌", "INVALID TICKET", "No record found.", "");
                        return;
                    }

                    if (ticket.status === 'checked_in') {
                        showResult("bg-yellow-500", "⚠️", "ALREADY USED", `Belongs to: ${ticket.full_name}`, `Time Slot: ${ticket.time_slot}`);
                        return;
                    }

                    if (ticket.status === 'paid') {
                        const { error: updateError } = await supabase
                            .from('registrations')
                            .update({ status: 'checked_in' })
                            .eq('id', ticket.id);

                        if (updateError) {
                            showResult("bg-red-600", "❌", "DATABASE ERROR", "Could not check in.", "");
                        } else {
                            showResult("bg-green-600", "✅", "ACCESS GRANTED", ticket.full_name, `Time Slot: ${ticket.time_slot}`);
                        }
                    }

                } catch (err) {
                    showResult("bg-red-600", "❌", "NETWORK ERROR", "Please check your connection.", "");
                }
            }

            function onScanFailure(error) {
                // Ignored
            }

            // 4. UI Display Function
            window.showResult = function(bgColor, icon, message, name, slot) {
                resultBox.classList.remove('bg-blue-600', 'bg-red-600', 'bg-yellow-500', 'bg-green-600', 'hidden');
                resultBox.classList.add(bgColor);
                resultIcon.innerText = icon;
                resultMessage.innerText = message;
                attendeeName.innerText = name;
                ticketSlot.innerText = slot;
            }

            window.resetScanner = function() {
                resultBox.classList.add('hidden');
                isScanning = true;
                html5QrcodeScanner.resume();
            }

            // 5. Start the Camera UI
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        };
    </script>
</body>
</html>
